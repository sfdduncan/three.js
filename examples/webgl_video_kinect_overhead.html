<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
        <style>
.lil-gui {
  --background-color: #e0e0e0;
  --title-background-color: #d4d0c8;
  --widget-color: #ffffff;
  --hover-color: #cccccc;
  --focus-color: #bbbbbb;
  --text-color: #000080;
  --title-text-color: #000080;
  --number-color: #000080;
  --string-color: #000080;

  --font-family: 'Chicago', 'Consolas', 'Courier New', monospace;
  --font-size: 10px;
  --input-font-size: 10px;

  --widget-height: 26px;
  --padding: 6px;
  --spacing: 6px;

  --widget-border-radius: 0px;
  --slider-knob-width: 2px;
  --slider-input-width: 30%;
  --color-input-width: 30%;
  --slider-input-min-width: 55px;
  --color-input-min-width: 55px;
  --name-width: 40%;

  --scrollbar-width: 5px;

  border: 2px solid #7f7f7f;
  box-shadow: inset -1px -1px 0 #ffffff, inset 1px 1px 0 #000000;
  text-transform: none;
}

/* Retro header style */
.lil-gui .title {
  background: linear-gradient(to bottom, #ffffff, #d4d0c8);
  color: var(--title-text-color);
  font-weight: bold;
  font-size: 10px;
  padding: 4px 8px;
  border-bottom: 2px solid #a0a0a0;
  box-shadow: inset -1px -1px 0 #ffffff, inset 1px 1px 0 #000000;
  text-align: center;
  text-shadow: 1px 1px #fff;
  align-items: center;	
    height: 26px;               /* match your --widget-height */
  line-height: 1.2;           /* adjust if needed */
  padding: 6px 8px;             /* remove vertical padding */
}

/* Button-style enhancements for classic look */
.lil-gui button {
  background: linear-gradient(to bottom, #ffffff, #c0c0c0);
  border: 1px solid #808080;
  color: #000080;
  box-shadow: inset -1px -1px 0 #ffffff, inset 1px 1px 0 #000000;
  font-weight: bold;
  font-size: 10px;
  text-shadow: none;
}

/* Input-style enhancements */
.lil-gui input[type="number"],
.lil-gui input[type="text"],
.lil-gui input[type="color"] {
  background: #ffffff;
  border: 1px solid #999;
  color: var(--text-color);
  box-shadow: inset 1px 1px 1px #ccc;
  padding: 0 4px;
}


.lil-gui .widget {
  display: flex;
  align-items: center;
  height: var(--widget-height, 26px); /* fallback if not set */
  padding: 0 var(--padding, 6px);
  box-sizing: border-box;
}

.lil-gui .name {
  line-height: 1;
  display: flex;
  align-items: center;
}

.lil-gui button,
.lil-gui input,
.lil-gui select {
  vertical-align: middle;
  line-height: normal;
}



</style>

	</head>
	<body>

		<video id="video" loop muted crossOrigin="anonymous" playsinline style="display:none">
			
			<source src="textures/walking_video_city.mp4">
		</video>

		<script id="vs" type="x-shader/x-vertex">

			uniform sampler2D map;

			uniform float width;
			uniform float height;
			uniform float nearClipping, farClipping;

			uniform float pointSize;
			uniform float zOffset;

			varying vec2 vUv;

			const float XtoZ = 1.11146; // tan( 1.0144686 / 2.0 ) * 2.0;
			const float YtoZ = 0.83359; // tan( 0.7898090 / 2.0 ) * 2.0;

			void main() {

				vUv = vec2( position.x / width, position.y / height );

				vec4 color = texture2D( map, vUv );
				float depth = ( color.r + color.g + color.b ) / 3.0;

				// Projection code by @kcmic

				float z = ( 1.0 - depth ) * (farClipping - nearClipping) + nearClipping;

				vec4 pos = vec4(
					( position.x / width - 0.5 ) * z * XtoZ,
					( position.y / height - 0.5 ) * z * YtoZ,
					- z + zOffset,
					1.0);

				gl_PointSize = pointSize;
				gl_Position = projectionMatrix * modelViewMatrix * pos;

			}

		</script>

		<script id="fs" type="x-shader/x-fragment">

			uniform sampler2D map;

			varying vec2 vUv;

			void main() {

				vec4 color = texture2D( map, vUv );
				gl_FragColor = vec4( color.r, color.g, color.b, 0.2 );

			}

		</script>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			let scene, camera, renderer;
			let geometry, mesh, material;
			let mouse, center;
            let isMouseDown = false;


			init();

			function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				const info = document.createElement( 'div' );
				info.id = 'info';
				info.innerHTML = '<a href="https://threejs.org" target="_blank" rel="noopener">';
				document.body.appendChild( info );

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 1, 10000 );
                camera.position.set(0, 900, 0); // move camera up and back

				scene = new THREE.Scene();
				center = new THREE.Vector3();
				center.z = - 1000;
                camera.lookAt(center);            // look toward center

				const video = document.getElementById( 'video' );

				const texture = new THREE.VideoTexture( video );
				texture.minFilter = THREE.NearestFilter;
				texture.generateMipmaps = false;

				const width = 1200, height = 800;
				const nearClipping = 1000, farClipping = 6000;

				geometry = new THREE.BufferGeometry();

				const vertices = new Float32Array( width * height * 3 );

				for ( let i = 0, j = 0, l = vertices.length; i < l; i += 3, j ++ ) {

					vertices[ i ] = j % width;
					vertices[ i + 1 ] = Math.floor( j / width );

				}

				geometry.setAttribute( 'position', new THREE.BufferAttribute( vertices, 3 ) );

				material = new THREE.ShaderMaterial( {

					uniforms: {

						'map': { value: texture },
						'width': { value: width },
						'height': { value: height },
						'nearClipping': { value: nearClipping },
						'farClipping': { value: farClipping },

						'pointSize': { value: 4 },
						'zOffset': { value: 750 }

					},
					vertexShader: document.getElementById( 'vs' ).textContent,
					fragmentShader: document.getElementById( 'fs' ).textContent,
					blending: THREE.AdditiveBlending,
					depthTest: false, depthWrite: false,
					transparent: true

				} );

				mesh = new THREE.Points( geometry, material );
				scene.add( mesh );

				const gui = new GUI();
                gui.close(); // this hides/collapses the GUI by default
				gui.add( material.uniforms.nearClipping, 'value', 1, 10000, 1.0 ).name( 'nearClipping' );
				gui.add( material.uniforms.farClipping, 'value', 1, 10000, 1.0 ).name( 'farClipping' );
				gui.add( material.uniforms.pointSize, 'value', 1, 10, 1.0 ).name( 'pointSize' );
				gui.add( material.uniforms.zOffset, 'value', 0, 4000, 1.0 ).name( 'zOffset' );

				video.play();

				//

				renderer = new THREE.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
                renderer.setClearColor(0x00008B); // Blue background
				renderer.setAnimationLoop( animate );
				container.appendChild( renderer.domElement );

				mouse = new THREE.Vector3( 0, 0, 1 );

                document.addEventListener('mousedown', () => isMouseDown = true);
                document.addEventListener('mouseup', () => isMouseDown = false);
                document.addEventListener('mousemove', onDocumentMouseMove);

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

            function onDocumentMouseMove(event) {
                if (!isMouseDown) return; // only move camera if mouse is held

                mouse.x = (event.clientX - window.innerWidth / 2) * 8;
                mouse.y = (event.clientY - window.innerHeight / 2) * 8;
            }


			function animate() {

                camera.position.y += ( -mouse.y - camera.position.y ) * 0.05;
                camera.lookAt(center);


				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
