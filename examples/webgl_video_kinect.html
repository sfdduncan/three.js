<!DOCTYPE html>
<html lang="en">
<head>
  <title>three.js - webcam point cloud</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <style>body { margin: 0; overflow: hidden; }</style>
</head>
<body>
  <video id="video" autoplay muted playsinline style="display: none; transform: scaleX(-1);"></video>

  <script id="vs" type="x-shader/x-vertex">
    uniform sampler2D map;
    uniform float width;
    uniform float height;
    uniform float nearClipping, farClipping;
    uniform float pointSize;
    uniform float zOffset;

    varying vec2 vUv;

    const float XtoZ = 1.11146;
    const float YtoZ = 0.83359;

    void main() {
      vUv = vec2(1.0 - position.x / width, position.y / height); // Flipped horizontally
      vec4 color = texture2D(map, vUv);
      float depth = (color.r + color.g + color.b) / 3.0;
      float z = (1.0 - depth) * (farClipping - nearClipping) + nearClipping;

      vec4 pos = vec4(
        (position.x / width - 0.5) * z * XtoZ,
        (position.y / height - 0.5) * z * YtoZ,
        -z + zOffset,
        1.0
      );

      gl_PointSize = pointSize;
      gl_Position = projectionMatrix * modelViewMatrix * pos;
    }
  </script>

  <script id="fs" type="x-shader/x-fragment">
    uniform sampler2D map;
    varying vec2 vUv;

void main() {
    gl_FragColor = vec4(1.0, 1.0, 1.0, 0.4); // solid white with slight transparency
  }
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

    let scene, camera, renderer;
    let geometry, mesh, material;
    let center;
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let targetRotation = { x: 0, y: 0 };
    let cameraDistance = 500;

    init();

    function init() {
      const container = document.createElement('div');
      document.body.appendChild(container);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 10000);
      camera.position.set(0, 0, cameraDistance);

      scene = new THREE.Scene();
      center = new THREE.Vector3(0, 0, -1000);

      const video = document.getElementById('video');
      navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
        video.srcObject = stream;
        video.play();
      }).catch((err) => {
        console.error("Webcam access error:", err);
      });

      const texture = new THREE.VideoTexture(video);
      texture.minFilter = THREE.NearestFilter;
      texture.generateMipmaps = false;

      const width = 640, height = 480;
      const nearClipping = 800, farClipping = 7500;

      geometry = new THREE.BufferGeometry();
      const vertices = new Float32Array(width * height * 3);

      for (let i = 0, j = 0, l = vertices.length; i < l; i += 3, j++) {
        vertices[i] = j % width;
        vertices[i + 1] = Math.floor(j / width);
        vertices[i + 2] = 0;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));

      material = new THREE.ShaderMaterial({
        uniforms: {
          'map': { value: texture },
          'width': { value: width },
          'height': { value: height },
          'nearClipping': { value: nearClipping },
          'farClipping': { value: farClipping },
          'pointSize': { value: 2 },
          'zOffset': { value: 1800 }
        },
        vertexShader: document.getElementById('vs').textContent,
        fragmentShader: document.getElementById('fs').textContent,
        blending: THREE.AdditiveBlending,
        depthTest: false,
        depthWrite: false,
        transparent: true
      });

      mesh = new THREE.Points(geometry, material);
      scene.add(mesh);

      const gui = new GUI();
      gui.close();
      gui.add(material.uniforms.nearClipping, 'value', 1, 10000).name('nearClipping');
      gui.add(material.uniforms.farClipping, 'value', 1, 10000).name('farClipping');
      gui.add(material.uniforms.pointSize, 'value', 1, 10).name('pointSize');
      gui.add(material.uniforms.zOffset, 'value', 0, 4000).name('zOffset');

      renderer = new THREE.WebGLRenderer();
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setAnimationLoop(animate);
      container.appendChild(renderer.domElement);

      window.addEventListener('resize', onWindowResize);

      // Drag rotation
      document.addEventListener('mousedown', function (e) {
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });

      document.addEventListener('mouseup', function () {
        isDragging = false;
      });

      document.addEventListener('mousemove', function (e) {
        if (!isDragging) return;
        const deltaMove = {
          x: e.clientX - previousMousePosition.x,
          y: e.clientY - previousMousePosition.y
        };
        targetRotation.y += deltaMove.x * 0.005;
        targetRotation.x += deltaMove.y * 0.005;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });

      // Zoom control
      document.addEventListener('wheel', function (e) {
        cameraDistance += e.deltaY * 0.5;
        cameraDistance = Math.max(100, Math.min(3000, cameraDistance));
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      const x = cameraDistance * Math.sin(targetRotation.y) * Math.cos(targetRotation.x);
      const y = cameraDistance * Math.sin(targetRotation.x);
      const z = cameraDistance * Math.cos(targetRotation.y) * Math.cos(targetRotation.x);
      camera.position.set(x, y, z);
      camera.lookAt(center);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
